name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: fleetify-${{ matrix.os }}
          path: target/release/fleetify*

  authoring:
    # No Rust toolchain here: the Python package is checked against the committed contract
    # (contract/recipe.schema.json and the golden recipe), not against a built binary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff lint
        working-directory: authoring
        run: uv run --locked --group dev ruff check .
      - name: Ruff format
        working-directory: authoring
        run: uv run --locked --group dev ruff format --check .
      - name: Python tests
        working-directory: authoring
        run: uv run --locked --group dev pytest -m "not binary"
