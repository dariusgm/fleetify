[package]
name = "fleetify"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Run one task across a list of Git repositories with an optional coding agent, verifier and CI gate."
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
command-group = "5.0.1"
ctrlc = "3.5.2"
regex = "1.13.1"
ratatui = "0.30"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
serde_json = "1.0.154"
toml = "1.1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
jsonschema = { version = "0.59.0", default-features = false }
