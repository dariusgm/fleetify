[package]
name = "fleetify"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Run one task across a list of Git repositories with an optional coding agent, verifier and CI gate."
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
command-group = "5.0.1"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
