[project]
name = "fleetify-recipes"
version = "0.1.0"
description = "Optional authoring aid for fleetify recipe.toml files. The fleetify binary never runs Python."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
validate = ["jsonschema>=4"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetify_recipes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
